<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MusallahBoard</title>
<!--
  The kiosk's first page on an enrolled board (packaging/start-kiosk.sh), and
  where it waits when the agent is not answering: file://, so it needs nothing
  from anyone. It pings the agent by loading an image from it (a file:// page
  cannot read an http response, but an image either loads or it does not) and
  moves to the board, whose address is in the fragment, the moment it answers.
  Without it, Chromium would show its own "refused to connect" page.

  It looks like the update screen: the marker in <style> is replaced with
  update-anim/index.html's stylesheet (font included) when install-system
  writes this file (packaging.Read), so the installed page has every byte it
  needs.
-->
<style>
/*{{screen-css}}*/
</style>
</head>
<body>
  <div class="veil" aria-hidden="true"></div>
  <div class="wash" aria-hidden="true"></div>
  <main class="screen" data-icon="working">
    <div class="state">
      <div class="focal">
        <svg class="throb" viewBox="0 0 200 200" aria-hidden="true"><circle class="sweep" cx="100" cy="100" r="76" /></svg>
      </div>
      <h1 class="headline">MusallahBoard is starting</h1>
      <ul class="lines"><li id="slow" hidden></li></ul>
    </div>
  </main>
<script>
(function () {
  var target = decodeURIComponent(location.hash.slice(1)) || 'http://127.0.0.1:8080/';
  var ping = target.replace(/\/*$/, '') + '/_mb/alive.gif';
  var started = Date.now();
  function check() {
    var img = new Image();
    img.onload = function () { location.replace(target); };
    img.onerror = function () {
      if (Date.now() - started > 3 * 60 * 1000) {
        var slow = document.getElementById('slow');
        slow.textContent =
          'This is taking longer than usual. If it does not clear in a few minutes, switch the board off and on again.';
        slow.hidden = false;
      }
      setTimeout(check, 2000);
    };
    img.src = ping + '?t=' + Date.now();
  }
  check();
})();
</script>
</body>
</html>
