<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MusallahBoard</title>
<style>
  /* The board's navy and gold, like the update screen (update-anim) and the
     starting page: this is the first thing a new board ever shows. */
  html,body{height:100%;margin:0;cursor:none}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
        background:#082D5D;color:#fff;font:300 4.2vmin/1.3 "Montserrat",system-ui,sans-serif;
        text-align:center}
  .dot{width:1.2vmin;height:1.2vmin;min-width:8px;min-height:8px;transform:rotate(45deg);
       background:#F8E15D;margin-top:3vmin;border-radius:1px;animation:p 1.6s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:.3}50%{opacity:1}}
  small{margin-top:2vmin;font:400 2.2vmin/1.4 system-ui,sans-serif;color:rgba(255,255,255,.7)}
  footer{position:fixed;bottom:2.4vmin;left:0;right:0;text-align:center;
         font:400 1.6vmin system-ui,sans-serif;color:rgba(255,255,255,.45)}

  /* Network card: hidden until the agent pushes something into it. */
  .net{margin-top:5vmin;padding:3vmin 5vmin;max-width:80vw;
       border:1px solid rgba(255,255,255,.16);border-radius:1.6vmin;background:rgba(0,0,0,.18)}
  .net[hidden]{display:none}
  .net-label{font:500 1.6vmin/1 system-ui,sans-serif;letter-spacing:.14em;
             text-transform:uppercase;color:rgba(255,255,255,.6)}
  .net-value{margin-top:1.6vmin;color:#F8E15D;word-break:break-all;
             font:600 4.6vmin/1.25 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .net-value.offline{color:#f0a88a}
  .net-meta{margin-top:1.2vmin;font:400 2vmin system-ui,sans-serif;color:rgba(255,255,255,.7)}
  .net-meta:empty{display:none}
  .net-next{margin-top:2.4vmin;padding-top:2vmin;border-top:1px solid rgba(255,255,255,.12);
            font:400 2.1vmin/1.5 system-ui,sans-serif;color:#fff}
  .net-next[hidden]{display:none}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#F8E15D}
</style>
</head>
<body>
  <div>Waiting for device enrollment…</div>
  <div class="dot"></div>
  <small>This screen clears automatically once the agent is enrolled.</small>

  <div class="net" id="net" hidden>
    <div class="net-label" id="net-label"></div>
    <div class="net-value" id="net-value"></div>
    <div class="net-meta" id="net-meta"></div>
    <div class="net-next" id="net-next" hidden>
      To enroll it, SSH in to this address as the admin user and run the<br>
      <code>sudo musallahboard-agent enroll …</code> command the admin portal gives you.
    </div>
  </div>

  <footer id="footer">MusallahBoard</footer>

  <!-- The kiosk unit restarts every few seconds; once the agent writes
       /etc/musallahboard/kiosk-url, the next restart loads the board. -->
  <script>
  // window.MusallahBoard.setNetInfo() is the contract the agent's
  // pre-enrollment loop calls over CDP (Runtime.evaluate) every few seconds —
  // see internal/splash. This page is loaded over file://, so it has an opaque
  // origin and cannot fetch its own address from anywhere; a push from the
  // agent is the only way it can know. Nothing renders until that first push,
  // which doubles as proof the agent is alive.
  (function () {
    var card  = document.getElementById('net');
    var label = document.getElementById('net-label');
    var value = document.getElementById('net-value');
    var meta  = document.getElementById('net-meta');

    function text(v) { return typeof v === 'string' ? v.trim() : ''; }

    window.MusallahBoard = window.MusallahBoard || {};
    window.MusallahBoard.setNetInfo = function (info) {
      info = info || {};
      var ips = Array.isArray(info.ipv4) ? info.ipv4.filter(text) : [];

      if (ips.length) {
        label.textContent = ips.length > 1 ? 'Reachable at' : 'This device is at';
        value.textContent = ips.join('   ·   ');
        value.classList.remove('offline');
        document.getElementById('net-next').hidden = false;
      } else {
        label.textContent = 'Network';
        value.textContent = 'Not connected';
        value.classList.add('offline');
        document.getElementById('net-next').hidden = true;
      }

      // Hostname and SSID are secondary: useful for telling two boards on a
      // cart apart, not worth competing with the address for attention.
      var bits = [];
      if (text(info.hostname)) bits.push(text(info.hostname));
      if (text(info.ssid)) bits.push('Wi-Fi: ' + text(info.ssid));
      meta.textContent = bits.join('   ·   ');

      // The version is the running agent's, pushed like the address, so it
      // is right after a self-update without this file being rewritten.
      if (text(info.agentVersion)) {
        document.getElementById('footer').textContent = 'MusallahBoard  ·  agent ' + text(info.agentVersion);
      }

      card.hidden = false;
    };
  })();
  </script>
</body>
</html>
