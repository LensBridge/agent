name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: agent

      - name: Check out the backend for its OpenAPI contract
        uses: actions/checkout@v4
        with:
          repository: LensBridge/LensBridgeBackend
          path: LensBridgeBackend

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Regenerate the API client
        working-directory: agent/internal/api
        run: |
          go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0 \
            -config oapi-codegen.yaml \
            "${{ github.workspace }}/LensBridgeBackend/openapi.yaml"

      - name: Fail if the generated client is stale
        working-directory: agent
        run: |
          if ! git diff --exit-code --stat -- internal/api/client.gen.go; then
            echo "::error::internal/api/client.gen.go is out of date with the backend contract."
            echo "Run 'go generate ./internal/api' and commit the result."
            git diff -- internal/api/client.gen.go
            exit 1
          fi
          echo "Generated client matches the backend contract."

      - name: Build
        working-directory: agent
        run: go build ./...

      - name: Vet
        working-directory: agent
        run: go vet ./...

      - name: Test
        working-directory: agent
        run: go test -race ./...

      - name: Shell syntax
        working-directory: agent
        run: |
          for f in setup.sh uninstall.sh packaging/*.sh packaging/lib/*.sh; do
            bash -n "$f"
          done
